# Lint do backend (Python): regras padrão do ruff (E4, E7, E9, F).
line-length = 130
target-version = "py312"
extend-exclude = ["data", ".venv", "venv"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# testes: nomes curtos em comprehensions, fixtures importadas de outros módulos de teste, imports no meio do arquivo
"tests/**" = ["E741", "E731", "F811", "E402"]
